name: ci-cd

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: "Promote an existing dev image SHA to prod"
        required: false
        type: boolean
        default: false
      image_sha:
        description: "Git SHA to promote, without the sha- prefix"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  APP_DIR: "app/source"
  BUILD_CONTEXT_DIR: "app"
  DOCKERFILE: "app/Dockerfile"

jobs:
  checks:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_prod != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show versions
        run: |
          python --version
          pip --version

      - name: Install CI tools
        run: pip install ruff pytest

      - name: Install app deps (if you have requirements.txt)
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ruff check
        working-directory: ${{ env.APP_DIR }}
        run: ruff check .

      - name: Ruff format check
        working-directory: ${{ env.APP_DIR }}
        run: ruff format --check .

      - name: Pytest
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: [checks]
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_prod != true
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKERFILE }}
          push: false
          load: true
          tags: two-tier-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: two-tier-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

      - name: Configure AWS creds (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ecr_image="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPO }}"
          docker tag two-tier-app:${{ github.sha }} "$ecr_image:sha-${{ github.sha }}"
          docker tag two-tier-app:${{ github.sha }} "$ecr_image:main"
          docker push "$ecr_image:sha-${{ github.sha }}"
          docker push "$ecr_image:main"

  deploy_dev:
    runs-on: ubuntu-latest
    needs: [build]
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy_dev
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_TASK_FAMILY }}
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPO }}:sha-${{ github.sha }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15


  deploy_prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_prod == true
    environment: prod
    concurrency:
      group: deploy_prod
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate promotion input
        run: |
          if [ -z "${{ inputs.image_sha }}" ]; then
            echo "image_sha is required when deploy_prod is true"
            exit 1
          fi

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote image from dev ECR to prod ECR
        run: |
          image_tag="sha-${{ inputs.image_sha }}"
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          source_image="$registry/${{ vars.SOURCE_ECR_REPO }}:$image_tag"
          prod_sha_image="$registry/${{ vars.ECR_REPO }}:$image_tag"
          prod_latest_image="$registry/${{ vars.ECR_REPO }}:prod"

          docker pull "$source_image"
          docker tag "$source_image" "$prod_sha_image"
          docker tag "$source_image" "$prod_latest_image"
          docker push "$prod_sha_image"
          docker push "$prod_latest_image"

      - name: Fill in the promoted image ID in the Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_TASK_FAMILY }}
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPO }}:sha-${{ inputs.image_sha }}

      - name: Deploy ECS task definition to prod
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
