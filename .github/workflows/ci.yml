name: ci

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  APP_DIR: "app/source"
  BUILD_CONTEXT_DIR: "app"
  DOCKERFILE: "app/Dockerfile"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show versions
        run: |
          python --version
          pip --version

      - name: Install CI tools
        run: pip install ruff pytest

      - name: Install app deps (if you have requirements.txt)
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ruff check
        working-directory: ${{ env.APP_DIR }}
        run: ruff check .

      - name: Ruff format check
        working-directory: ${{ env.APP_DIR }}
        run: ruff format --check .

      - name: Pytest
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest

  docker_build:
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKERFILE }}
          push: false
          tags: github-actions-demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_push_ecr:
    runs-on: ubuntu-latest
    needs: [docker_build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:sha-${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
